<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Estructura con Columnas</title>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(74, 19, 18);
            padding: 10px 20px;
            color: white;
        }

        /* Estilo con tamaño controlado para el logo de la cabecera */
        .logo-cabecera {
            width: 100px;
            height: auto;
            display: block;
        }

        main {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        aside {
            width: 25%;
            background-color: rgb(252, 199, 177);
            padding: 15px;
        }

        section {
            width: 75%;
            background-color: rgb(226, 181, 232);
            padding: 15px;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1 style="margin: 0;">Mi Sitio Web</h1>
            <nav>Menu de navegacion</nav>
        </div>
        <img src="imagenes/wendy.jpg" alt="Logo de Mi Sitio Web" class="logo-cabecera">
    </header>

    <main>
        <aside>
            <h3>Barra Lateral</h3>
            <p>Enlaces, publicidad o categorias.</p>
        </aside>
        <section>
            <article>
                <h2>Articulo principal</h2>
                <p>Contenido del articulo...</p>
            </article>
        </section>
    </main>

    <footer>
        <p>Pie de pagina</p>
    </footer>
</body>

</html>
